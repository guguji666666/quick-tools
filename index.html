<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quick Tools 是一个运行在浏览器里的常用小工具集合。" data-i18n-content="metaDescription">
    <title>Quick Tools</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="工具列表" data-i18n-aria-label="toolList">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">QT</span>
          <div>
            <h1>Quick Tools</h1>
            <p data-i18n="brandSubtitle">本地浏览器工具箱</p>
          </div>
        </div>

        <nav class="tool-nav">
          <div class="tool-list-item">
            <button class="tool-button active" type="button" data-tool="yaml-diff" aria-current="page">
              <span class="tool-icon" aria-hidden="true">{ }</span>
              <span>
                <strong>YAML Diff</strong>
                <small data-i18n="semanticDiff">语义比对</small>
              </span>
            </button>
          </div>
          <div class="tool-list-item">
            <button class="tool-button" type="button" data-tool="it-tools">
              <span class="tool-icon" aria-hidden="true">IT</span>
              <span>
                <strong>IT Tools</strong>
                <small data-i18n="embeddedToolbox">内嵌工具集</small>
              </span>
            </button>
          </div>
        </nav>
      </aside>

      <section class="workspace" aria-labelledby="tool-title">
        <header class="workspace-header">
          <div>
            <p class="eyebrow" id="toolEyebrow">YAML Diff</p>
            <h2 id="tool-title" data-i18n="toolTitle">快速比对两个 YAML 文件</h2>
          </div>
          <div class="header-actions">
            <div class="language-switch" aria-label="语言切换" data-i18n-aria-label="languageSwitch">
              <button type="button" data-language="zh">中文</button>
              <button type="button" data-language="en">EN</button>
            </div>
            <div class="status-pill" id="workerStatus">空闲</div>
          </div>
        </header>

        <section class="yaml-tool tool-panel" data-tool-panel="yaml-diff">
          <div class="session-bar" aria-label="比对会话" data-i18n-aria-label="sessionBar">
            <div class="session-tabs" id="sessionTabs"></div>
            <button class="ghost-button session-new" type="button" id="newSessionButton" data-i18n="newSession">新建会话</button>
          </div>

          <div class="input-grid">
            <section class="input-panel">
              <span data-i18n="leftYaml">原始 YAML</span>
              <textarea id="leftInput" spellcheck="false" placeholder="粘贴旧版本 YAML" data-i18n-placeholder="leftPlaceholder"></textarea>
              <div class="diff-pane" id="leftDiffPane" hidden></div>
            </section>
            <section class="input-panel">
              <span data-i18n="rightYaml">修改后 YAML</span>
              <textarea id="rightInput" spellcheck="false" placeholder="粘贴新版本 YAML" data-i18n-placeholder="rightPlaceholder"></textarea>
              <div class="diff-pane" id="rightDiffPane" hidden></div>
            </section>
          </div>

          <div class="toolbar">
            <button class="primary-button" type="button" id="compareButton">开始比对</button>
            <button class="ghost-button" type="button" id="editButton" hidden data-i18n="editContent">编辑内容</button>
            <button class="ghost-button" type="button" id="sampleButton" data-i18n="fillSample">填入示例</button>
            <button class="ghost-button" type="button" id="clearButton" data-i18n="clear">清空</button>
            <label class="toggle-row">
              <input type="checkbox" id="sortKeys" checked>
              <span data-i18n="sortKeys">排序对象键</span>
            </label>
          </div>

          <div class="message" id="message" hidden></div>

          <section class="summary-grid" aria-label="比对摘要" data-i18n-aria-label="summary">
            <div>
              <strong id="addedCount">0</strong>
              <span data-i18n="added">新增</span>
            </div>
            <div>
              <strong id="removedCount">0</strong>
              <span data-i18n="removed">删除</span>
            </div>
            <div>
              <strong id="changedCount">0</strong>
              <span data-i18n="changed">修改</span>
            </div>
            <div>
              <strong id="duration">0ms</strong>
              <span data-i18n="duration">耗时</span>
            </div>
          </section>

        </section>

        <section class="it-tools-panel tool-panel" data-tool-panel="it-tools" hidden>
          <div class="it-hero">
            <div>
              <p class="eyebrow" data-i18n="itToolsEyebrow">内嵌工具集</p>
              <h3 data-i18n="itToolsTitle">常用开发转换工具</h3>
              <p data-i18n="itToolsDescription">这些工具直接运行在当前页面里，不上传数据，不依赖外部服务。</p>
            </div>
            <div class="it-actions">
              <a class="ghost-button" href="https://github.com/CorentinTh/it-tools" target="_blank" rel="noopener noreferrer" data-i18n="viewSource">参考项目</a>
            </div>
          </div>

          <section class="it-workbench">
            <nav class="it-tool-list" aria-label="内嵌工具列表" data-i18n-aria-label="embeddedToolList">
              <div class="tool-list-item">
                <button class="it-tool-button active" type="button" data-it-tool="json" aria-current="page">
                  <strong>JSON</strong>
                  <span data-i18n="jsonToolMeta">格式化 / 压缩</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="base64">
                  <strong>Base64</strong>
                  <span data-i18n="base64ToolMeta">编码 / 解码</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="url">
                  <strong>URL</strong>
                  <span data-i18n="urlToolMeta">编码 / 解码</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="sha256">
                  <strong>SHA-256</strong>
                  <span data-i18n="shaToolMeta">生成摘要</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="uuid">
                  <strong>UUID</strong>
                  <span data-i18n="uuidToolMeta">生成 UUID</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="timestamp">
                  <strong>Timestamp</strong>
                  <span data-i18n="timestampToolMeta">时间戳转换</span>
                </button>
              </div>
              <div class="tool-list-item">
                <button class="it-tool-button" type="button" data-it-tool="text-case">
                  <strong>Text Case</strong>
                  <span data-i18n="textCaseToolMeta">大小写转换</span>
                </button>
              </div>
            </nav>

            <div class="it-tool-stage">
              <div class="it-tool-header">
                <div>
                  <p class="eyebrow" id="itToolType">JSON</p>
                  <h3 id="itToolTitle">JSON 格式化</h3>
                </div>
                <label class="mode-field" id="itModeField">
                  <span data-i18n="mode">模式</span>
                  <select id="itModeSelect"></select>
                </label>
              </div>

              <div class="it-editor-grid">
                <label class="input-panel">
                  <span id="itInputLabel">输入</span>
                  <textarea id="itInput" spellcheck="false"></textarea>
                </label>
                <label class="input-panel">
                  <span id="itOutputLabel">输出</span>
                  <textarea id="itOutput" spellcheck="false" readonly></textarea>
                </label>
              </div>

              <div class="toolbar">
                <button class="primary-button" type="button" id="runItToolButton" data-i18n="runTool">运行</button>
                <button class="ghost-button" type="button" id="fillItSampleButton" data-i18n="fillSample">填入示例</button>
                <button class="ghost-button" type="button" id="copyItOutputButton" data-i18n="copyOutput">复制结果</button>
                <button class="ghost-button" type="button" id="clearItToolButton" data-i18n="clear">清空</button>
              </div>

              <div class="message" id="itMessage" hidden></div>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="./src/app.js"></script>
  </body>
</html>
